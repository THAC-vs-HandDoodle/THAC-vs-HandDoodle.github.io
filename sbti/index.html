</head>

                desc: "在社交、修仙、发疯、摆烂之间反复横跳。没有人能预判你的下一步。",
                quote: "“啊对对对，啊是是是。”"
            },
            "CELD": {
                nickname: "CELL",
                full: "Coward Eating Logical Deadline",
                desc: "社恐干饭人，逻辑清晰，靠死线驱动生命。你的能量条只在干饭和死线时充满。",
                quote: "“别跟我说话，除非你带着吃的。”"
            },
            "CELZ": {
                nickname: "CELLO",
                full: "Coward Eating Logical Zen",
                desc: "社恐但爱干饭，逻辑告诉我：摆烂吧。你在逃避社交的同时疯狂摄入碳水。",
                quote: "“外面太危险了，我点个外卖压压惊。”"
            },
            "CEMD": {
                nickname: "CHEM",
                full: "Coward Eating Mad Deadline",
                desc: "社恐干饭，但死线临近时会进入疯批状态。你平时安静如鸡，死线前变成尖叫鸡。",
                quote: "“别管我，让我创死这个世界！”"
            },
            "CEMZ": {
                nickname: "DRUNK",   // 明星人格
                full: "Coward Eating Mad Zen · 醉酒型",
                desc: "社恐干饭，内心发疯，表面岁月静好。你是典型的精神醉酒状态——看似平静，其实脑子已经断片了。",
                quote: "“我没醉……我只是……和这个世界不太熟。”"
            },
            "CSLD": {
                nickname: "CURSED",
                full: "Coward Spiritual Logical Deadline",
                desc: "社恐修仙，逻辑极强但永远被死线诅咒。你总是在最后关头才爆发出小宇宙。",
                quote: "“我恨这个世界，但我能解这道题。”"
            },
            "CSLZ": {
                nickname: "CHASM",
                full: "Coward Spiritual Logical Zen",
                desc: "深渊型人格：社恐修仙有逻辑，但就是不想动。你在脑内构建了宇宙，现实中一动不动。",
                quote: "“zzzZZZ……（大脑还在高速运转）”"
            },
            "CSMD": {
                nickname: "CHAOS",
                full: "Coward Spiritual Mad Deadline",
                desc: "社恐修仙，死线前精神世界彻底崩坏。你是一个行走的混乱能量体。",
                quote: "“别催了，再催我就原地升天。”"
            },
            "CSMZ": {
                nickname: "ZZZZ",    // 明星人格
                full: "Coward Spiritual Mad Zen · 睡死了型",
                desc: "零社交零食欲，大脑在发疯身体在躺平。你的人生终极目标是和被子结婚。",
                quote: "“Zzzzzz……(翻译：世界再见)”"
            }
        };

        // 额外明星人格强行映射 (SEMZ虽然已经有，但我们可以再给个别名，但已够用)
        // 让 FUCK 对应某个结果：可以定为 SSMD 或 SSMZ 之类的，为了搞怪我们强行指定一个彩蛋。
        // 当检测到特定组合时显示 FUCK (但为了严谨，在结果展示时对 SEMZ 再处理？)
        // 我们用更骚的方式：在得到缩写后，对特定缩写再套一个“彩蛋昵称”
        const easterEggNick = {
            "SEMZ": "F.U.C.K.",   // Freaking Unhinged Chaotic Kalm
            "CEMZ": "DRUNK",
            "CSMZ": "ZZZZ"
        };
        const easterFull = {
            "SEMZ": "Freaking Unhinged Chaotic Kalm",
            "CEMZ": "Delusional Rambling Under No Kontrol",
            "CSMZ": "Zero Zest, Zero Zip"
        };

        // ---------- 状态 ----------
        let currentIndex = 0;                // 0-19
        let answers = new Array(20).fill(null); // 存储每道题所选选项索引 (0~3)
        
        // 维度分数 (累加)
        let scores = {
            S: 0, C: 0,
            E: 0, Spiritual: 0,
            L: 0, M: 0,
            D: 0, Z: 0
        };

        // DOM 元素
        const quizArea = document.getElementById('quizArea');
        const resultArea = document.getElementById('resultArea');
        const questionText = document.getElementById('questionText');
        const optionsDiv = document.getElementById('optionsContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const questionCounter = document.getElementById('questionCounter');
        const progressFill = document.getElementById('progressFill');
        const restartBtn = document.getElementById('restartBtn');
        
        const resultCode = document.getElementById('resultCode');
        const personaName = document.getElementById('personaName');
        const fullName = document.getElementById('fullName');
        const resultDesc = document.getElementById('resultDesc');
        const resultQuote = document.getElementById('resultQuote');

        // ---------- 辅助函数 ----------
        function calculateScoresFromAnswers() {
            // 重置分数
            scores = { S:0, C:0, E:0, Spiritual:0, L:0, M:0, D:0, Z:0 };
            for (let i=0; i<questions.length; i++) {
                const ansIdx = answers[i];
                if (ansIdx === null) continue; // 理论上不会
                const selectedOpt = questions[i].options[ansIdx];
                const inc = selectedOpt.scores;
                for (let dim in inc) {
                    if (scores.hasOwnProperty(dim)) {
                        scores[dim] += inc[dim];
                    }
                }
            }
        }

        function determineSBTI() {
            const first = scores.S > scores.C ? 'S' : 'C';
            const second = scores.E > scores.Spiritual ? 'E' : 'S';
            const third = scores.L > scores.M ? 'L' : 'M';
            const fourth = scores.D > scores.Z ? 'D' : 'Z';
            return first + second + third + fourth;
        }

        function renderQuestion(index) {
            const q = questions[index];
            questionText.textContent = q.text;
            // 生成选项按钮
            optionsDiv.innerHTML = '';
            q.options.forEach((opt, optIdx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt.text;
                if (answers[index] === optIdx) {
                    btn.style.background = '#7a2e8a';
                    btn.style.borderColor = '#ffff00';
                    btn.style.boxShadow = '0 0 20px gold';
                }
                btn.addEventListener('click', () => {
                    // 选择答案
                    answers[index] = optIdx;
                    renderQuestion(index); // 刷新高亮
                    // 自动跳到下一题？为了流畅，我们不做自动跳转，让用户点下一题
                    // 但启用下一题按钮
                    updateNavButtons();
                });
                optionsDiv.appendChild(btn);
            });
            
            // 更新计数和进度
            questionCounter.textContent = `第${index+1}/${questions.length}题`;
            const progressPercent = ((index+1) / questions.length) * 100;
            progressFill.style.width = progressPercent + '%';
            
            updateNavButtons();
        }

        function updateNavButtons() {
            prevBtn.disabled = (currentIndex === 0);
            if (currentIndex === questions.length - 1) {
                nextBtn.textContent = '📊 看结果';
            } else {
                nextBtn.textContent = '下一题 ▶';
            }
            // 如果当前题目未选答案，不能进入下一题？
            // 我们允许跳过？为了体验，建议必选。但可以用提醒。 
            // 简单处理：不限制，但计算时若answers有null将导致分数丢失。最好强制选。
            if (answers[currentIndex] === null) {
                nextBtn.disabled = true;
            } else {
                nextBtn.disabled = false;
            }
        }

        function goToNext() {
            if (answers[currentIndex] === null) {
                alert('🤔 选一个吧，不然测出来不准！');
                return;
            }
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion(currentIndex);
            } else {
                // 完成测试，计算结果
                finishAndShowResult();
            }
        }

        function goToPrev() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(currentIndex);
            }
        }

        function finishAndShowResult() {
            // 确保所有题目都有答案 (防御)
            if (answers.includes(null)) {
                alert('⚠️ 有题目漏选了，请检查！');
                return;
            }
            calculateScoresFromAnswers();
            const code = determineSBTI();
            
            // 获取基础人格
            let persona = personalityMap[code];
            if (!persona) {
                // fallback (极不可能)
                persona = {
                    nickname: code,
                    full: "未知生物",
                    desc: "你的精神状态已经超出了我们的认知范围。",
                    quote: "?"
                };
            }
            
            // 彩蛋覆盖
            let displayNick = persona.nickname;
            let displayFull = persona.full;
            if (easterEggNick[code]) {
                displayNick = easterEggNick[code];
                displayFull = easterFull[code] || persona.full;
            }
            
            // 渲染结果
            resultCode.textContent = code;
            personaName.textContent = displayNick;
            fullName.textContent = displayFull;
            resultDesc.textContent = persona.desc;
            resultQuote.textContent = `“${persona.quote}”`;
            
            // 切换界面
            quizArea.classList.add('hidden');
            resultArea.classList.remove('hidden');
        }

        function restartTest() {
            // 重置
            currentIndex = 0;
            answers = new Array(20).fill(null);
            scores = { S:0, C:0, E:0, Spiritual:0, L:0, M:0, D:0, Z:0 };
            
            quizArea.classList.remove('hidden');
            resultArea.classList.add('hidden');
            renderQuestion(0);
        }

        // 绑定事件
        nextBtn.addEventListener('click', goToNext);
        prevBtn.addEventListener('click', goToPrev);
        restartBtn.addEventListener('click', restartTest);

        // 初始化
        renderQuestion(0);
        
        // 处理特殊情况：如果用户改变答案，next按钮状态跟着变
        // 已在render时调用updateNavButtons
    })();
</script>
</body>
</html>
